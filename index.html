<title>KEP Pharmacy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Khmer:wght@400;500;600;700&family=Noto+Serif+Khmer:wght@600;700&display=swap">
<style>
/* Ink & Gold, dark-first. Layout: fixed left rail + working canvas; POS = catalog | ticket */
:root{
  --bg:#0f1218;--panel:#161a22;--panel2:#1c212b;--line:#2a303b;--fg:#ebe6d9;--muted:#9b978b;
  --gold:#d6aa4c;--on-gold:#1b1405;--ok:#58b884;--warn:#e3a93e;--bad:#e5655d;--info:#79a9d6;
  --f-body:'Noto Sans Khmer',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-disp:'Noto Serif Khmer','Noto Sans Khmer',Georgia,serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:8px;color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f5f2ea;--panel:#fffdf8;--panel2:#f0ebdf;--line:#ddd5c3;--fg:#1e1b15;--muted:#6c665a;
  --gold:#94680f;--on-gold:#fffaf0;--ok:#22774c;--warn:#9a6200;--bad:#b3352e;--info:#2f6a9e;color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f5f2ea;--panel:#fffdf8;--panel2:#f0ebdf;--line:#ddd5c3;--fg:#1e1b15;--muted:#6c665a;
  --gold:#94680f;--on-gold:#fffaf0;--ok:#22774c;--warn:#9a6200;--bad:#b3352e;--info:#2f6a9e;color-scheme:light}
:root[data-theme="dark"]{
  --bg:#0f1218;--panel:#161a22;--panel2:#1c212b;--line:#2a303b;--fg:#ebe6d9;--muted:#9b978b;
  --gold:#d6aa4c;--on-gold:#1b1405;--ok:#58b884;--warn:#e3a93e;--bad:#e5655d;--info:#79a9d6;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:14px/1.6 var(--f-body);-webkit-text-size-adjust:100%}
@media (min-width:1600px) and (min-height:860px){body{font-size:15px}}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
small{font-size:.78rem}
.muted{color:var(--muted)}
.grow{flex:1}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* shell */
/* desktop & tablet: the app is pinned to the visible screen, only inner panes scroll */
.app{display:flex;position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px)}
.side{width:236px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{display:flex;gap:12px;align-items:center;padding:20px 18px;border-bottom:1px solid var(--line)}
.logo{width:52px;height:52px;border-radius:50%;flex-shrink:0;background:#fff;box-shadow:0 0 0 2px var(--gold)}
.rc-logo{width:64px;height:64px;border-radius:50%;display:block;margin:0 auto 6px}
.scanbtn{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap;align-self:stretch}
.scanbtn:hover{border-color:var(--gold);color:var(--gold)}
.scanbtn svg{width:18px;height:18px;flex-shrink:0}
.inp-row{display:flex;gap:6px;align-items:stretch}
.inp-row .inp{flex:1}
#reader{width:100%;min-height:200px;border-radius:8px;overflow:hidden;background:#000;display:grid;place-items:center;color:#aaa;text-align:center}
#reader video{width:100%!important;display:block}
.scan-status{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.scan-status.bad{color:var(--bad)}
.usb-hint{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--muted);background:var(--panel2);border-radius:6px;padding:8px 10px;margin-top:10px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.brand b{display:block;font:700 1.05rem/1.3 var(--f-disp);color:var(--gold)}
.brand small{color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-size:.68rem}
#nav{display:flex;flex-direction:column;padding:10px 0;flex:1;gap:2px}
#nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;padding:10px 18px;border-left:3px solid transparent;color:var(--muted)}
#nav button small{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;opacity:.7;text-transform:uppercase}
#nav button:hover{color:var(--fg);background:var(--panel2)}
#nav button.on{color:var(--fg);border-left-color:var(--gold);background:var(--panel2)}
#nav button.on small{color:var(--gold);opacity:1}
#nav button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.duty{padding:14px 18px;border-top:1px solid var(--line);display:grid;gap:2px}
.duty small{color:var(--muted)}
.duty b{font-weight:600}
.duty .mono{color:var(--gold);font-size:.75rem}

.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.side{overflow-y:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{margin:0;font:700 1.25rem/1.3 var(--f-disp);text-wrap:balance}
.top h1 small{font:500 .7rem var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-left:8px}
.top-meta{display:flex;gap:8px;flex-wrap:wrap}
.view{flex:1;min-height:0;overflow:auto;padding:20px 24px}
.view-pos{overflow:hidden;padding:16px}
.cartbar{display:none}

/* atoms */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;outline:none;min-width:0}
.inp:focus{border-color:var(--gold)}
label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
label.check{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:.9rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn.gold:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
kbd{font:500 .65rem var(--f-mono);border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.7;margin-left:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted)}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.chip.info{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
.chip.gold{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
.chip.sm{font-size:.66rem;padding:0 6px}
button.chip{border:0;cursor:pointer}
.eyebrow{display:block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:28px 12px}
.empty.tall{display:flex;flex-direction:column;gap:4px;justify-content:center;height:100%;min-height:160px}
.empty.tall b{color:var(--fg);font-weight:600}

/* tables */
.tablewrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;font-weight:600;font-size:.74rem;color:var(--muted);letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--gold) 5%,transparent)}
.tbl .r{text-align:right}
.tbl small.sub{display:block;color:var(--muted)}
.tbl tfoot td{font-weight:600;background:var(--panel2);border-top:1px solid var(--line)}
tr.voided td{opacity:.5;text-decoration:line-through}
tr.click{cursor:pointer}

.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}

/* ---------- storage ---------- */
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- lookups ---------- */
const prod=id=>S.products.find(p=>p.id===id);
const batch=id=>S.batches.find(b=>b.id===id);
const sup=id=>S.suppliers.find(s=>s.id===id);
const sellable=pid=>S.batches.reduce((s,b)=>s+(b.pid===pid&&b.qty>0&&daysTo(b.exp)>=0?b.qty:0),0);
function pStatus(p){const q=sellable(p.id);return q===0?'out':q<=p.reorder?'low':'ok'}
function statusChip(p){const s=pStatus(p);return s==='out'?'<span class="chip bad">អស់ស្តុក</span>':s==='low'?'<span class="chip warn">ស្តុកទាប</span>':'<span class="chip ok">គ្រប់គ្រាន់</span>'}
function expChip(exp){const d=daysTo(exp);if(d<0)return `<span class="chip bad">ផុតកំណត់ ${-d} ថ្ងៃ</span>`;if(d<=S.set.warnDays)return `<span class="chip warn">នៅ ${d} ថ្ងៃ</span>`;return `<span class="chip">នៅ ${d} ថ្ងៃ</span>`}
const nextNo=()=>'INV-'+String(S.counter+1).padStart(6,'0');

/* ---------- core: FEFO allocation & sales ---------- */
function allocate(pid,qty){
  const bs=S.batches.filter(b=>b.pid===pid&&b.qty>0&&daysTo(b.exp)>=0).sort((a,b)=>a.exp<b.exp?-1:a.exp>b.exp?1:0);
  let need=qty;const out=[];
  for(const b of bs){if(!need)break;const t=Math.min(b.qty,need);out.push({bid:b.id,qty:t,batch:b.batch,exp:b.exp});need-=t}
  return need?null:out;
}
function createSale(items,o,ts){
  const allocs=items.map(i=>allocate(i.pid,i.qty));
  if(allocs.some(a=>!a))return null;
  S.counter++;const no='INV-'+String(S.counter).padStart(6,'0');
  const lines=items.map((i,k)=>{
    const p=prod(i.pid),a=allocs[k];
    const cost=a.reduce((s,x)=>s+x.qty*batch(x.bid).cost,0);
    a.forEach(x=>{batch(x.bid).qty-=x.qty;S.moves.push({ts,type:'SALE',pid:p.id,bid:x.bid,qty:-x.qty,note:no})});
    return{pid:p.id,name:p.name,unit:p.unit,qty:i.qty,price:p.price,cost:round2(cost),alloc:a};
  });
  const sub=round2(lines.reduce((s,l)=>s+l.price*l.qty,0));
  const disc=round2(sub*(o.disc||0)/100),total=round2(sub-disc);
  const sale={id:uid(),no,ts,lines,sub,discPct:o.disc||0,disc,total,cost:round2(lines.reduce((s,l)=>s+l.cost,0)),
    pay:o.pay,paid:round2(o.paid??total),rate:S.set.rate,cust:o.cust||'',rx:o.rx||'',staff:S.set.staff,void:false};
  S.sales.push(sale);return sale;
}
function voidSale(id){
  const s=S.sales.find(x=>x.id===id);if(!s||s.void)return;
  const ts=Date.now();
  s.lines.forEach(l=>l.alloc.forEach(a=>{const b=batch(a.bid);if(b){b.qty+=a.qty;S.moves.push({ts,type:'VOID',pid:l.pid,bid:a.bid,qty:a.qty,note:s.no})}}));
  s.void=true;s.voidTs=ts;save();
}

let scanner=null,scanCb=null,scanDone=false;
function loadScanLib(){

  return urls.reduce((p,u)=>p.catch(()=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=()=>window.Html5Qrcode?res():rej();s.onerror=rej;document.head.appendChild(s)})),Promise.reject());

function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=1800;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.09);o.onended=()=>a.close()}catch(e){}}

  const status=(m,bad)=>{const el=$('#scanStatus');if(el){el.textContent=m;el.className='scan-status'+(bad?' bad':'')}};
  $('#scanFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;status('កំពុងអានរូប...');
    try{await loadScanLib();stopScan();const tmp=new Html5Qrcode('reader',{verbose:false,experimentalFeatures:{useBarCodeDetectorIfSupported:true}});const r=await tmp.scanFile(f,false);try{tmp.clear()}catch(_){}scanResult(r)}

/* USB / Bluetooth scanners type fast and end with Enter */
let kb={buf:'',last:0};
document.addEventListener('keydown',e=>{
  const now=performance.now();
  if(mode!=='staff'){kb.buf='';return}
  if(e.key==='Enter'){
    const fast=kb.buf.length>=4&&now-kb.last<60,code=kb.buf;kb.buf='';
    const t=e.target,typing=t.matches?.('input,textarea,select');
    if(fast&&!typing&&$('#modal').hidden){e.preventDefault();e.stopImmediatePropagation();posCode(code)}
    return;
  }
  if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){kb.buf=(now-kb.last>60?'':kb.buf)+e.key;kb.last=now}
},true);

function addToCart(pid,n=1){const p=prod(pid),q=sellable(pid),c=P.cart.find(x=>x.pid===pid);
  if(q<=0)return toast('ឱសថនេះអស់ពីស្តុក','bad');
  if((c?c.qty:0)+n>q)return toast(`ស្តុកនៅសល់តែ ${q} ${p.unit}`,'bad');
  c?c.qty+=n:P.cart.push({pid,qty:n});refreshPOS()}
function setQty(pid,n){const q=sellable(pid),c=P.cart.find(x=>x.pid===pid);if(!c)return;
  if(n>q){n=q;toast(`ស្តុកនៅសល់តែ ${q}`,'bad')}
  if(n<=0)P.cart=P.cart.filter(x=>x.pid!==pid);else c.qty=n;refreshPOS()}
function checkout(){
  if(!P.cart.length)return toast('សូមបន្ថែមឱសថចូលវិក្កយបត្រជាមុនសិន','bad');
  if(P.cart.some(c=>prod(c.pid).rx)&&!P.rx.trim()){toast('មានថ្នាំ Rx — សូមបញ្ចូលលេខវេជ្ជបញ្ជា','bad');$('#rx').focus();return}
  const t=calc();
  if(P.pay==='cash'&&t.paid>0&&t.paid+0.004<t.total)return toast('ប្រាក់ទទួលមិនគ្រប់ចំនួន','bad');
  const sale=createSale(P.cart.map(c=>({pid:c.pid,qty:c.qty})),{disc:t.d,pay:P.pay,paid:P.pay==='cash'&&t.paid>0?t.paid:t.total,cust:P.cust.trim(),rx:P.rx.trim()},Date.now());
  if(!sale)return toast('ស្តុកមិនគ្រប់ — សូមពិនិត្យម្តងទៀត','bad');
  if(P.orderId){const o=S.orders.find(x=>x.id===P.orderId);if(o&&o.status==='new'){o.status='done';o.saleNo=sale.no;o.doneTs=Date.now()}}
  save();resetP();renderPOS();drawTop();drawNav();showReceipt(sale,true);
}

function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of[1,2,2.5,5,10])if(m*p>=v)return m*p;return 10*p}
function barChart(days){
  const W=560,H=210,L=40,B=26,T=18,cw=(W-L-8)/days.length,max=niceMax(Math.max(1,...days.map(d=>d.v))),y=v=>T+(H-T-B)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ចំណូល ៧ ថ្ងៃចុងក្រោយ">`;
  [0,.5,1].forEach(f=>{const v=max*f;s+=`<line class="gridl" x1="${L}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}"/><text class="ctext" x="${L-6}" y="${y(v)+4}" text-anchor="end">$${v%1?v.toFixed(1):v}</text>`});
  days.forEach((d,i)=>{const x=L+i*cw+cw*.2,w=cw*.6,h=(H-T-B)-(y(d.v)-T);
    s+=`<rect class="bar ${i===days.length-1?'today':''}" x="${x}" y="${y(d.v)}" width="${w}" height="${Math.max(h,0)}" rx="3"/>`;
    if(d.v>0)s+=`<text class="cval" x="${x+w/2}" y="${y(d.v)-5}" text-anchor="middle">${d.v.toFixed(0)}</text>`;
    s+=`<text class="ctext" x="${x+w/2}" y="${H-8}" text-anchor="middle">${i===days.length-1?'ថ្ងៃនេះ':dm(d.k)}</text>`});
  return s+'</svg>'}

  const wk=days.reduce((a,d)=>a+d.v,0);

  const stockVal=S.batches.filter(b=>b.qty>0&&daysTo(b.exp)>=0).reduce((a,b)=>a+b.qty*b.cost,0);
  const lows=S.products.filter(p=>pStatus(p)!=='ok');

  V().innerHTML=`<div class="kpis">
    <div class="panel kpi lead"><span>ចំណូលថ្ងៃនេះ</span><b>${usd(rev)}</b><small class="mono">${khr(rev)}</small></div>
    <div class="panel kpi"><span>ប្រាក់ចំណេញដុលថ្ងៃនេះ</span><b>${usd(gp)}</b><small>${rev?(gp/rev*100).toFixed(0):0}% margin</small></div>
    <div class="panel kpi"><span>វិក្កយបត្រថ្ងៃនេះ</span><b>${td.length}</b><small>មធ្យម ${usd(td.length?rev/td.length:0)} / វិក្កយបត្រ</small></div>
    <div class="panel kpi"><span>តម្លៃស្តុក (ថ្លៃដើម)</span><b>${usd(stockVal)}</b><small>${S.products.length} មុខឱសថ</small></div></div>
  <div class="rgrid">
    <div class="panel"><div class="card-h"><h3>ចំណូល ៧ ថ្ងៃ</h3><small class="mono">សរុប ${usd(wk)}</small></div><div class="chart">${barChart(days)}</div></div>
    <div class="panel"><div class="card-h"><h3>វិធីបង់ប្រាក់ថ្ងៃនេះ</h3></div><ul class="alist">${Object.keys(PAYS).map(k=>`<li><span>${PAYS[k]}</span><span class="mono">${usd(pays[k]||0)}</span></li>`).join('')}</ul></div>
  </div>
  <div class="rgrid">
    <div class="panel"><div class="card-h"><h3>ឱសថលក់ដាច់ជាងគេ</h3><small>៣០ ថ្ងៃចុងក្រោយ</small></div><ul class="alist">${top.map(a=>`<li style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(a.name)} <small class="muted">${a.q} ${esc(a.unit)}</small></span><span class="mono">${usd(a.v)}</span></div><div class="meter"><i style="width:${a.v/topMax*100}%"></i></div></li>`).join('')||'<li class="muted">មិនទាន់មានទិន្នន័យ</li>'}</ul></div>

  S.orders.push(o);save();resetC();renderShop();
  openModal(`<div class="done-big"><img src="${LOGO}" alt=""><span class="muted">អរគុណ ${esc(o.name)}! យើងបានទទួលការបញ្ជាទិញ</span><b>${o.no}</b></div>
    <ul class="oitems" style="padding:0">${o.items.map(i=>`<li><span>${esc(i.name)} × ${i.qty}</span><span class="mono">${usd(i.qty*i.price)}</span></li>`).join('')}</ul>
    <div class="totals" style="margin-top:8px"><div class="big"><span>សរុប</span><span class="mono">${usd(o.total)}</span></div><div><span>ជាប្រាក់រៀល</span><span class="mono">${khr(o.total)}</span></div></div>
    <p class="muted" style="margin:12px 0 0">${PICK[o.pick]}${o.addr?' — '+esc(o.addr):''}។ ឱសថការីនឹងទូរស័ព្ទទៅលេខ <b class="mono">${esc(o.phone)}</b> ដើម្បីបញ្ជាក់។ ទូរស័ព្ទមកយើង៖ <b class="mono">${esc(S.set.phone)}</b></p>
    ${o.items.some(i=>i.rx)?'<p class="rx-note" style="margin:10px 0 0">មានឱសថ Rx — សូមយកវេជ្ជបញ្ជាមកបង្ហាញ</p>':''}
    <div class="sheet-actions"><span class="grow"></span><button class="btn gold" data-act="closeModal">រួចរាល់</button></div>`,'narrow');
}

/* ---------- staff: orders inbox ---------- */
let orderF='new';
const OST={new:['ថ្មី','info'],done:['បានលក់','ok'],cancel:['បានបោះបង់','bad']};
function renderOrders(){
  const cnt=k=>S.orders.filter(o=>k==='all'||o.status===k).length;
  const list=S.orders.filter(o=>orderF==='all'||o.status===orderF).sort((a,b)=>orderF==='new'?a.ts-b.ts:b.ts-a.ts);
  V().innerHTML=`<div class="filters">${[['new','ថ្មី'],['done','បានលក់'],['cancel','បានបោះបង់'],['all','ទាំងអស់']].map(([k,v])=>`<button class="chipbtn ${orderF===k?'on':''}" data-of="${k}">${v}<b>${cnt(k)}</b></button>`).join('')}</div>
  <div class="olist">${list.map(o=>`<article class="panel ocard">
    <header><div><b class="mono">${o.no}</b> <span class="chip ${OST[o.status][1]}">${OST[o.status][0]}</span><small>${fmtDT(o.ts)}</small></div><span class="ototal">${usd(o.total)}</span></header>
    <div class="ometa"><span><b>${esc(o.name)}</b> · <span class="mono">${esc(o.phone)}</span></span><span><span class="k">ទទួល៖</span> ${PICK[o.pick]}${o.addr?' — '+esc(o.addr):''}</span>${o.note?`<span><span class="k">សម្គាល់៖</span> ${esc(o.note)}</span>`:''}</div>
    <ul class="oitems">${o.items.map(i=>`<li><span>${esc(i.name)} × ${i.qty}${i.rx?' <span class="chip bad sm">Rx</span>':''}</span><span class="mono">${usd(i.qty*i.price)}</span></li>`).join('')}</ul>
    <footer>${o.status==='new'?`<button class="btn danger ghost sm" data-act="cancelOrder" data-id="${o.id}">បោះបង់</button><button class="btn gold sm" data-act="orderToPOS" data-id="${o.id}">យកទៅលក់ (POS)</button>`
      :o.status==='done'?`<span class="muted mono">${esc(o.saleNo||'')}</span>`:'<span class="muted">បានបោះបង់</span>'}</footer></article>`).join('')||`<div class="empty panel">មិនមានការបញ្ជាទិញក្នុងបញ្ជីនេះ</div>`}</div>`}
function orderToPOS(id){const o=S.orders.find(x=>x.id===id);resetP();const miss=[];
  o.items.forEach(i=>{if(!prod(i.pid))return miss.push(i.name);const q=Math.min(i.qty,sellable(i.pid));if(q>0)P.cart.push({pid:i.pid,qty:q});if(q<i.qty)miss.push(i.name)});
  P.cust=`${o.name} · ${o.phone}`;P.orderId=o.id;go('pos');
  if(miss.length)toast('ស្តុកមិនគ្រប់៖ '+miss.join(', '),'bad');else toast(`បានបញ្ចូល ${o.no} ទៅ POS`,'ok')}
Object.assign(ACTS,{
  enterShop,placeOrder,
  exitShop(){showGate()},
  logout(){showGate()},
  shopClear(){C.cart=[];drawShopGrid();drawShopCart()},
  toSTicket(){$('#sticket')?.scrollIntoView({behavior:'smooth',block:'start'})},
  orderToPOS(el){orderToPOS(el.dataset.id)},
  cancelOrder(el){const o=S.orders.find(x=>x.id===el.dataset.id);confirmBox(`បោះបង់ ${o.no}?`,`ការបញ្ជាទិញរបស់ ${esc(o.name)} នឹងត្រូវបោះបង់។`,'បោះបង់ការបញ្ជាទិញ',()=>{o.status='cancel';save();drawNav();render();toast('បានបោះបង់','ok')})}
});
/* orders placed from another tab on this device */
window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;const before=S.orders.length;try{S=JSON.parse(e.newValue);migrate()}catch(err){return}
  if(mode==='staff'){drawNav();drawTop();if(view==='orders')render();if(S.orders.length>before){beep();toast('មានការបញ្ជាទិញថ្មី','ok')}}
  else if(mode==='shop'){drawShopGrid()}});

/* ---------- boot ---------- */
load();resetP();resetR();resetC();
document.querySelectorAll('img[data-logo]').forEach(i=>i.src=LOGO);
tick();setInterval(tick,15000);
let authed=false;try{authed=sessionStorage.getItem(AUTH)==='1'}catch(e){}
if(location.hash==='#shop')enterShop();else if(authed)enterStaff();else showGate();
</script>
